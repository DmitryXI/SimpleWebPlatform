<div id="${id}" style="position:relative; z-index:${z}; border:solid black 1px; padding 0px; text-align: center;">
    <div style="width: 100%; font-size: 20px; background-color: #CCC; text-align: center; padding: 0px; padding-top: 5px; padding-bottom: 5px;">Создайте либо выберите существующую игру</div>
    <input type="button" id="${id}_new_game" value="Создать новую игру" style="width: 90%; height: 25%; padding: 0px; border: solid 1px; margin: 10px; font-size: 20px;">
    <input type="button" disabled id="${id}_join_game" value="Подключиться к существующей" style="width: 90%; height: 25%; padding: 0px; border: solid 1px; margin: 0px; font-size: 20px;">
</div>
